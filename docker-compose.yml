# MountainConnect Docker Compose
# Usage: docker compose up -d

services:
  db:
    image: mysql:8.0
    container_name: jejak_db
    restart: always
    environment:
      MYSQL_DATABASE: jejak
      MYSQL_USER: jejak_user
      MYSQL_PASSWORD: SecretPassword123!
      MYSQL_ROOT_PASSWORD: RootPassword123!
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 300M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jejak_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_DIALECT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: jejak_user
      DB_PASSWORD: SecretPassword123!
      DB_DATABASE: jejak
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-jejak-secret-key-change-in-production}
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 350M

  redis:
    image: redis:7-alpine
    container_name: jejak_redis
    restart: always
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 100M

  web:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: jejak_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-secret}
      NEXT_PUBLIC_API_URL: http://backend:4000/api/v1
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 350M

volumes:
  mysql_data:
  redis_data:
