# Jejak App - Launch Smoke Test
# Verifies the app builds, installs, and renders the login screen.
#
# NOTE (MIUI/Redmi): Maestro's launchApp can silently fail to start the app
# right after `pm clear` (MIUI freezes the package and swallows the launch
# intent). Pre-launch the app from the host before running this flow:
#   adb shell am force-stop com.jejakapp
#   adb shell pm clear com.jejakapp
#   adb shell am start -n com.jejakapp/.MainActivity
# (debug builds load the JS bundle from Metro: cd mobile && npx react-native start)
# Run: maestro test mobile/.maestro/smoke-test.yaml
appId: com.jejakapp
name: Jejak Launch Smoke Test
---
- extendedWaitUntil:
    visible:
      text: "Jejak"
    timeout: 180000
- assertVisible:
    text: "Masuk ke akun Anda"
- assertVisible:
    text: "Email"
- assertVisible:
    text: "Password"
- assertVisible:
    text: "Masuk"
- takeScreenshot: "01-login-screen"
- tapOn: "Lupa password?"
- assertVisible: "Forgot Password"
- takeScreenshot: "02-forgot-password"
- back
- assertVisible:
    text: "Masuk ke akun Anda"
- takeScreenshot: "03-back-to-login"
